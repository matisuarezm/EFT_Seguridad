# ===================================================================
# Configuración General de la Aplicación
# ===================================================================
spring.application.name=EFTSeguridad
server.port=8180
spring.main.allow-bean-definition-overriding=true

# ===================================================================
# Configuración de Base de Datos (MySQL mediante Docker Compose)
# ===================================================================
# Conexión local a MySQL expuesto en el puerto 3307
spring.datasource.url=jdbc:mysql://localhost:3307/eftseguridad
spring.datasource.username=myuser
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Opción alternativa para entorno interno de Docker (comentada)
# spring.datasource.url=jdbc:mysql://mysql-cdy2203:3306/mydatabase

# ===================================================================
# Configuración JPA / Hibernate
# ===================================================================
# Actualiza automáticamente las tablas según las entidades Java (@Entity)
spring.jpa.hibernate.ddl-auto=update

# Dialecto genérico actualizado para compatibilidad con Hibernate 6/7
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Dialecto antiguo (obsoleto en versiones recientes, dejado por referencia)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===================================================================
# Configuración de Logging y Archivos de Registro
# ===================================================================
logging.file.name=backend.log

# Niveles de Log
logging.level.org.springframework.web=trace
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate=trace
logging.level.com=TRACE